name: Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Run unit tests
        run: yarn test

  e2e-build:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.specs.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: List E2E specs
        id: specs
        run: |
          # A separate Firefox runner per spec avoids the browser reconnect
          # failure seen between specs; Chrome can run the whole suite at once.
          # The action resolves spec paths from the repository root.
          include=$(find packages/web-app/cypress/e2e -type f \( -name '*.cy.js' -o -name '*.cy.jsx' -o -name '*.cy.ts' -o -name '*.cy.tsx' \) | sort | jq -R . | jq -s -c 'map({browser: "firefox", spec: .}) + [{browser: "chrome", spec: ""}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Build app for E2E
        # Bake a non-routable API URL into the E2E bundle so any spec that
        # forgets `cy.mockApiCatchAll()` fails fast with ECONNREFUSED instead
        # of silently calling production and burning the 200 req / 10 min / IP
        # budget (issue #1554). Cypress intercepts match by pathname, so the
        # explicit mocks keep working regardless of the host.
        #
        # The port must NOT be on the WHATWG Fetch "bad ports" list
        # (https://fetch.spec.whatwg.org/#port-blocking) — Chrome and Firefox
        # refuse those requests at the browser layer, before CDP/proxy
        # intercepts can see them, so every `cy.wait('@alias')` would time
        # out. 9999 is high, unassigned, and not on the list.
        run: yarn build
        env:
          VITE_API_URL: http://127.0.0.1:9999
      - name: Share built app
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: packages/web-app/dist
          include-hidden-files: true
          if-no-files-found: error
          # Keep the artifact around for "Re-run failed jobs": e2e-build won't
          # re-run when it's green, so a next-day retry needs the dist to still
          # be here.
          retention-days: 7

  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-build.outputs.include) }}
    name: ${{ matrix.spec && format('e2e ({0}, {1})', matrix.browser, matrix.spec) || format('e2e ({0})', matrix.browser) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Restore built app
        uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: packages/web-app/dist
      # Install NPM dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
          spec: ${{ matrix.spec }}
          project: packages/web-app
          # Serve the production build so Vite cannot invalidate optimized
          # dependency chunks while a slower browser is still using them.
          start: >
            yarn preview --host 0.0.0.0 --port 3000 --strictPort
          wait-on: 'http://localhost:3000'
