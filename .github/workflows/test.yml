name: Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Run unit tests
        run: yarn test

  e2e-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.specs.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List E2E specs
        id: specs
        run: |
          # A separate Firefox runner per spec avoids the browser reconnect
          # failure seen between specs; Chrome can run the whole suite at once.
          include=$(find packages/web-app/cypress/e2e -maxdepth 1 -type f -name '*.cy.js' -printf '%f\n' | sort | jq -R . | jq -s -c 'map({browser: "firefox", spec: ("cypress/e2e/" + .)}) + [{browser: "chrome", spec: ""}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  e2e:
    needs: e2e-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-matrix.outputs.include) }}
    name: ${{ matrix.spec && format('e2e ({0}, {1})', matrix.browser, matrix.spec) || format('e2e ({0})', matrix.browser) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      # Install NPM dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
          spec: ${{ matrix.spec }}
          build: yarn build
          project: packages/web-app
          # Serve the production build so Vite cannot invalidate optimized
          # dependency chunks while a slower browser is still using them.
          start: >
            yarn preview --host 0.0.0.0 --port 3000 --strictPort
          wait-on: 'http://localhost:3000'
