name: TWA Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name, semver X.Y.Z (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      # Only semver release tags (1.0.0, 10.2.3…) trigger a build + Release.
      # GitHub Actions tag filters are globs, not regex: [0-9] is a digit class,
      # + means "one or more of the preceding", and \. escapes the literal dot
      # (without escaping, `.` would match any character — including `-`, which
      # would let tags like `1-0-0` trigger a build only to fail semver validation).
      # The Resolve step still validates strict semver as defense-in-depth (and
      # for workflow_dispatch).
      - '[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build TWA APK / AAB
    permissions:
      # Required so the workflow can create the GitHub Release (and its tag on dispatch).
      contents: write
    defaults:
      run:
        # The Bubblewrap project lives in twa/. All `run` steps execute there, so
        # the keystore, manifest and build outputs stay scoped to that folder.
        working-directory: twa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          else
            # Tag push: derive the name from the tag (v1.2.3 -> 1.2.3).
            NAME="${GITHUB_REF_NAME#v}"
          fi
          # versionName must be strict semver X.Y.Z (human-facing version).
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (got '$NAME')"
            exit 1
          fi
          # versionCode = the CI run number: a counter GitHub increments on every
          # run, so it is strictly increasing for each build (a hard Play Store
          # requirement) and decoupled from versionName.
          CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NAME (code $CODE)"

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Set version in app/build.gradle
        # Edit the version Gradle actually uses. (We build the committed Gradle
        # project directly, so twa-manifest.json is not involved at build time.)
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build signed AAB + APK with Gradle
        # Sign via Gradle's signingConfig (see app/build.gradle): Gradle passes the
        # passwords straight to the Java signing API — no shell command — so special
        # characters in the password are safe. The Android SDK is auto-detected from
        # ANDROID_SDK_ROOT on the runner.
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/twa/android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: grottocenter
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grottocenter-twa-${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}
          # uses-step paths are relative to the repo root, not working-directory.
          path: |
            twa/app/build/outputs/bundle/release/*.aab
            twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push GITHUB_REF_NAME is reused; on workflow_dispatch the tag
          # is created from the resolved version name. Tags are plain semver (no v).
          tag_name: ${{ steps.version.outputs.name }}
          name: Grottocenter App ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          # files are relative to the repo root, not working-directory.
          files: |
            twa/app/build/outputs/bundle/release/*.aab
            twa/app/build/outputs/apk/release/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
