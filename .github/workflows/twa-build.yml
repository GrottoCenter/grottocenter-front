name: TWA Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name, semver X.Y.Z (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      # Only semver release tags (v1.0.0, v10.2.3…) trigger a build + Release.
      # GitHub Actions tag filters are globs, not regex: [0-9] is a digit class
      # and + means "one or more of the preceding". The Resolve step still
      # validates strict semver as defense-in-depth (and for workflow_dispatch).
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build TWA APK / AAB
    permissions:
      # Required so the workflow can create the GitHub Release (and its tag on dispatch).
      contents: write
    defaults:
      run:
        # The Bubblewrap project lives in twa/. All `run` steps execute there, so
        # the keystore, manifest and build outputs stay scoped to that folder.
        working-directory: twa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          else
            # Tag push: derive the name from the tag (v1.2.3 -> 1.2.3).
            NAME="${GITHUB_REF_NAME#v}"
          fi
          # Require strict semver X.Y.Z — the version code is derived from it.
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (got '$NAME')"
            exit 1
          fi
          # Deterministic, monotonic version code from semver:
          # major*10000 + minor*100 + patch (e.g. 1.2.3 -> 10203). Same value for
          # both triggers, always increasing with the released version.
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          # 10# forces base-10 so a zero-padded segment (e.g. 08) isn't read as octal.
          CODE=$(( 10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NAME (code $CODE)"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Update version in twa-manifest.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.appVersionName = process.env.VERSION_NAME;
            manifest.appVersionCode = parseInt(process.env.VERSION_CODE, 10);
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Build AAB with Bubblewrap
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --key-store-password "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-password "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grottocenter-twa-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}
          # uses-step paths are relative to the repo root, not working-directory.
          path: |
            twa/*.aab
            twa/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, GITHUB_REF_NAME is reused; on workflow_dispatch the tag
          # is created from the resolved version name.
          tag_name: v${{ steps.version.outputs.name }}
          name: GrottoCenter TWA v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          # files are relative to the repo root, not working-directory.
          files: |
            twa/*.aab
            twa/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
