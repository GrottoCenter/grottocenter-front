name: TWA Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'App version code (integer, must be higher than previous Play Store release)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build TWA APK / AAB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Update version in twa-manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.appVersionName = '${{ github.event.inputs.version_name }}';
            manifest.appVersionCode = parseInt('${{ github.event.inputs.version_code }}', 10);
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Build AAB with Bubblewrap
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --key-store-password "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-password "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grottocenter-twa-${{ github.event.inputs.version_name }}-v${{ github.event.inputs.version_code }}
          path: |
            app-release-bundle.aab
            app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
