name: TWA Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name, semver X.Y.Z (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      # Only semver release tags (1.0.0, 10.2.3…) trigger a build + Release.
      # GitHub Actions tag filters are globs, not regex: [0-9] is a digit class
      # and + means "one or more of the preceding". The Resolve step still
      # validates strict semver as defense-in-depth (and for workflow_dispatch).
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build TWA APK / AAB
    permissions:
      # Required so the workflow can create the GitHub Release (and its tag on dispatch).
      contents: write
    defaults:
      run:
        # The Bubblewrap project lives in twa/. All `run` steps execute there, so
        # the keystore, manifest and build outputs stay scoped to that folder.
        working-directory: twa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          else
            # Tag push: derive the name from the tag (v1.2.3 -> 1.2.3).
            NAME="${GITHUB_REF_NAME#v}"
          fi
          # versionName must be strict semver X.Y.Z (human-facing version).
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z (got '$NAME')"
            exit 1
          fi
          # versionCode = the CI run number: a counter GitHub increments on every
          # run, so it is strictly increasing for each build (a hard Play Store
          # requirement) and decoupled from versionName.
          CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NAME (code $CODE)"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap for CI (non-interactive)
        # On a fresh runner Bubblewrap has no config and prompts to install the
        # JDK/Android SDK, which hangs (then exits 130) in CI. Point it at the
        # JDK from setup-java and the Android SDK preinstalled on the runner.
        #
        # Bubblewrap also validates that <sdk>/tools or <sdk>/bin exists, but the
        # runner keeps its command-line tools under cmdline-tools/latest, so it
        # rejects the SDK ("The provided androidSdk isn't correct."). Symlinking
        # <sdk>/tools -> cmdline-tools/latest satisfies the check and keeps
        # tools/bin/sdkmanager resolvable, while build-tools/ and platforms/
        # remain at the SDK root for Gradle.
        run: |
          # ANDROID_SDK_ROOT/ANDROID_HOME are runner OS env vars, read from the
          # shell (not the ${{ env }} workflow context, which wouldn't see them).
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -e "$SDK/tools" ] && [ -d "$SDK/cmdline-tools/latest" ]; then
            ln -s "$SDK/cmdline-tools/latest" "$SDK/tools" \
              || sudo ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          SDK="$SDK" node -e "require('fs').writeFileSync(process.env.HOME + '/.bubblewrap/config.json', JSON.stringify({ jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.SDK }))"
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Set version in app/build.gradle
        # Edit the version Gradle actually uses, NOT twa-manifest.json — leaving the
        # manifest untouched keeps it in sync with manifest-checksum.txt, so
        # `bubblewrap build` detects no change and never prompts to regenerate.
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build AAB with Bubblewrap
        # Bubblewrap has NO password CLI flags — it reads the keystore/key passwords
        # only from these env vars (both must be set). `printf 'n\n'` answers "no" to
        # any residual "apply manifest changes?" prompt so the build never blocks and
        # never regenerates over the version we just set. With manifest and checksum
        # committed in sync, no prompt appears at all.
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf 'n\n' | bubblewrap build --skipPwaValidation

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grottocenter-twa-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}
          # uses-step paths are relative to the repo root, not working-directory.
          path: |
            twa/*.aab
            twa/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, GITHUB_REF_NAME is reused; on workflow_dispatch the tag
          # is created from the resolved version name.
          tag_name: v${{ steps.version.outputs.name }}
          name: GrottoCenter TWA v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          # files are relative to the repo root, not working-directory.
          files: |
            twa/*.aab
            twa/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android.keystore
