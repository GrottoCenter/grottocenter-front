<!doctype html>

<html lang="en">
  <head>
    <title>Grottocenter</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5d4037" />
    <meta
      name="description"
      content="Share, understand and protect the underground world."
    />

    <!-- Favicons -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS / legacy add-to-home-screen (standalone mode, status bar, title) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grottocenter" />

    <!--
      The PWA manifest (and its <link rel="manifest">) is generated and injected
      automatically by vite-plugin-pwa at build time — see vite.config.mjs.
    -->

    <meta name="robots" content="noindex, nofollow" />

    <!--
      Open Graph (Google, Facebook, LinkedIn previews) and Twitter Card image
      URLs are hardcoded to the production origin. Any non-prod deployment
      (staging, Azure preview URLs, etc.) will therefore serve social cards
      pointing at grottocenter.org rather than its own origin. This is
      intentional: previews are not indexed (see robots meta above) and we
      want production-quality cards when someone shares a preview link.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grottocenter.org" />
    <meta property="og:site_name" content="Grottocenter" />
    <meta property="og:title" content="Grottocenter" />
    <meta
      property="og:description"
      content="Share, understand and protect the underground world."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://grottocenter.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card — same hardcoded-prod-origin caveat as the OG image above. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grottocenter" />
    <meta
      name="twitter:description"
      content="Share, understand and protect the underground world."
    />
    <meta name="twitter:image" content="https://grottocenter.org/og-image.png" />

    <!-- Google Fonts: preconnect to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap"
    />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        /*
          Keeps the document scroll from chaining out to the browser: no
          pull-to-refresh (it reloads the app and wipes the Redux state — a known
          gesture in a browser tab, but the installed PWA/TWA has no URL bar to
          explain it) and no rubber-band bounce revealing the void behind the
          page. Scrolling itself is unaffected, unlike a zoom lock.

          `-y` on purpose, not the shorthand: horizontal overscroll is what
          desktop Chrome/Safari use for two-finger swipe-to-go-back, and there is
          nothing to gain from blocking it.
        */
        overscroll-behavior-y: none;
      }
      .loader {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        background-color: #5d4037;
        transition: opacity 0.4s;
        opacity: 1;
      }
      .loaderOff {
        opacity: 0 !important;
      }
      .logo {
        width: 25%;
        margin: auto;
        padding-top: 15%;
      }
      #bottom {
        animation: bottomAnim 1.5s linear infinite;
      }
      #top {
        animation: bottomTop 1.5s linear infinite;
      }
      @keyframes bottomTop {
        0% {
          stroke-dashoffset: 522.24;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      @keyframes bottomAnim {
        0% {
          stroke-dashoffset: 391;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      #root {
        transition: opacity 0.4s;
        opacity: 0;
      }
      .rootDisplay {
        opacity: 1 !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div class="loader">
      <div class="logo">
        <svg
          id="eEqkoNHJ67b1"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 0 195.547 126.359"
          shape-rendering="geometricPrecision"
          text-rendering="geometricPrecision"
        >
          <path
            id="point"
            d="M107.375,84.331c-12.283,5.413-26.535-.37-31.834-12.918-5.3-12.547.363-27.107,12.646-32.52c12.284-5.413,26.536.371,31.835,12.918c5.232,12.391-.22,26.78-12.257,32.343"
            transform="translate(-.654591 2.954649)"
            fill="#9a140c"
            fill-rule="evenodd"
          />
          <path
            id="top"
            d="M12.473017,77.858673c0,0,12.412281,2.607693,21.010105-4.357633C50.800657,59.471645,52.624768,12.449248,96.947764,12.449248s44.968303,41.17425,59.988902,56.761663c9.324112,9.675965,26.158727,8.647762,26.158727,8.647762"
            transform="translate(.000002 0.000001)"
            fill="none"
            stroke="#059865"
            stroke-width="25"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-dashoffset="522.24"
            stroke-dasharray="261.118752"
          />
          <path
            id="bottom"
            d="M12.473018,114.104h170.622376"
            transform="translate(.000001-.213255)"
            fill="none"
            stroke="#056598"
            stroke-width="25"
            stroke-linecap="round"
            stroke-dashoffset="391"
            stroke-dasharray="195.498402"
          />
        </svg>
      </div>
    </div>
    <script>
      // Intl management will be takeover by react once it is loaded
      const selectedLanguage =
        window.localStorage.getItem('selectedLanguage') ??
        navigator.language.split(/[-_]/)[0];
      const intlBootstrap = {
        defaultLocale: 'en',
        allLanguages: [
          'ar',
          'bg',
          'ca',
          'de',
          'el',
          'en',
          'es',
          'fr',
          'he',
          'id',
          'it',
          'ja',
          'nl',
          'pt',
          'ro'
          // If you change this list, don't forget to also update the AVAILABLE_LANGUAGES object in src/conf/config.js
        ],
        initialLocale: selectedLanguage,
        initialFetchP: null
      };

      if (!intlBootstrap.allLanguages.includes(intlBootstrap.initialLocale))
        intlBootstrap.initialLocale = intlBootstrap.defaultLocale;

      // Expose on window so the ESM app bundle (deferred module script) can read it.
      window.intlBootstrap = intlBootstrap;

      // Keep in sync with AVAILABLE_LANGUAGES.direction in src/conf/config.js
      const RTL_LOCALES = ['ar', 'he'];
      document.documentElement.lang = intlBootstrap.initialLocale;
      document.documentElement.dir = RTL_LOCALES.indexOf(intlBootstrap.initialLocale) !== -1 ? 'rtl' : 'ltr';

      // While react is still loading we start to get the initial locale strings.
      // Swallow errors (e.g. offline first-launch of the PWA) so the app still
      // boots — react-intl will fall back to raw message ids until a later
      // fetch succeeds.
      //
      // Resolve to null, NOT {}: bootstrapIntl stores whatever lands here as
      // the locale's messages, and an empty object is indistinguishable from a
      // real (empty) translation file. It would mark the locale loaded forever,
      // so the retry on reconnect could never fire.
      intlBootstrap.initialFetchP = fetch(
        `/lang/${intlBootstrap.initialLocale}.json`
      )
        .then(r => r.json())
        .catch(() => null);
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
